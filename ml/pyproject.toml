[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integrity-ml"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
# Dependencies are added in the phase that first uses them, together with tests.
# AST features (SPEC 6.3): parser and grammar pinned exactly; grammar_info() records the hashes.
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "tree-sitter==0.25.2", "tree-sitter-python==0.25.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The encoder (SPEC 7.1). Install the CUDA build from PyTorch's index, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# Verified: torch 2.11.0+cu128 on an RTX 3050 6 GB. Encoder tests skip without it.
deep = ["torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
