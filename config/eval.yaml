# Evaluation. See docs/SPEC.md section 12.
split:
  scheme: nested_user_cv         # [PROPOSED D-008]
  outer_folds: 5
  inner_val_frac: 0.25
  repeats_seeds: [1, 2, 3]
bootstrap:
  resamples: 10000
  unit: participant
  ci: 0.95
false_flag_rate: 0.05
attacks: [A1, A2, A3a, A3b, A4, A5, A6, A7, A8]
test_ledger: eval/ledger/test_access.jsonl
keycheck:                        # real-keyboard check report, development data only (docs/keycheck.md)
  normal_tasks: [prose, code]    # tasks used for overlap and clock-agreement statistics
  min_jank_keydowns: 20          # fewer keydowns in task 4 gives "not enough data"
  input_time_min_inside_frac: 0.15   # >= this share of task-4 keydowns stamped inside a main-thread block: timeStamp is the input time
  dispatch_time_max_inside_frac: 0.02
  dispatch_time_max_lag_ms: 2.0      # and a median lag below this: timeStamp is the dispatch time
  top_overlap_pairs: 5
synthetic_keystrokes:            # D3 generator for pipeline tests only; never reported as results
  dataset_id: d3_synthetic_keystrokes_v1
  subjects: 100
  sequences_per_subject: 15      # mirrors the TypeNet protocol (10 gallery + 5 query sentences)
  keys_per_sequence: 70
  alphabet: [KeyA, KeyB, KeyC, KeyD, KeyE, KeyF, KeyG, KeyH, KeyI, KeyJ, KeyK, KeyL, KeyM,
             KeyN, KeyO, KeyP, KeyQ, KeyR, KeyS, KeyT, KeyU, KeyV, KeyW, KeyX, KeyY, KeyZ, Space]
  vocabulary_words: 300
  base_flight_ms: 180            # population median press-to-press
  base_hold_ms: 95
  digraph_difficulty_log_sd: 0.30   # shared by everyone
  key_hold_log_sd: 0.15             # shared by everyone
  user_speed_log_sd: 0.25           # x separation
  user_digraph_log_sd: 0.25         # x separation
  user_hold_log_sd: 0.20            # x separation
  noise_flight_log_sd: 0.25         # within-user, per keystroke
  noise_hold_log_sd: 0.15
  separations: [0.0, 0.5, 1.0]      # 0 = everyone types identically (EER should be near 50%)
  encoder_epochs: 20                # pipeline check only; the D1 run uses models.yaml max_epochs
fusion_dryrun:                   # SYNTHETIC D4 sessions (integrity_eval.synthetic_sessions): a test of the fusion pipeline, never a result
  dataset_id: d4_synthetic_sessions_v1
  users: 40
  outer_folds: 5
  inner_folds: 4
  base_flight_ms: 190            # population median press-to-press
  base_hold_ms: 95
  user_speed_log_sd: 0.25
  user_hold_log_sd: 0.20
  user_pair_log_sd: 0.25         # per-user habit per key pair
  noise_flight_log_sd: 0.30      # within-user, per keystroke
  noise_hold_log_sd: 0.15
  pause_p_range: [0.05, 0.20]    # chance of a 2-5 s pause before a line (copy-typing)
  typo_p_range: [0.01, 0.04]
  composing_pause_scale: 2.5     # genuine exam: more pauses than practice...
  composing_typo_scale: 1.5      # ...more corrections...
  composing_pause_s: [3.0, 10.0] # ...and longer pauses
  a1_typed_share: 0.3            # A1 types this share, then leaves and pastes the rest
  a1_away_s: [20, 60]
  auto_typer_flight_ms: 110      # A2: near-constant rhythm (+-1%)
  auto_typer_hold_ms: 55
  population_flight_log_sd: 0.45 # A3a: iid jitter around the population medians
  population_hold_log_sd: 0.25
  a3b_flight_max_s: 2.0          # A3b: resamples the user's own practice flights below this (pauses excluded)
  a8_speed_factor: [0.75, 0.9]   # A8: other keyboard, flight x this (faster)
  a8_hold_factor: [1.1, 1.3]     # ... and longer holds
