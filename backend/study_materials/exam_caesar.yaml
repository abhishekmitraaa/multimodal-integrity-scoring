  text: |
    def caesar(s, k):
        shifted = []
        for ch in s:
            if "a" <= ch <= "z":
                shifted.append(chr((ord(ch) - ord("a") + k) % 26 + ord("a")))
            elif "A" <= ch <= "Z":
                shifted.append(chr((ord(ch) - ord("A") + k) % 26 + ord("A")))
            else:
                shifted.append(ch)
        return "".join(shifted)
