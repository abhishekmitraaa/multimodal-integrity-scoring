id: practice_letter_grade
kind: practice
stage: baseline              # builds the baseline (D-036)
title: Letter grade
statement: |
  Write a function `letter_grade(score)` that turns a score from 0 to 100 into a letter:
  90 and above is A, 80 and above is B, 70 and above is C, 60 and above is D, anything lower is F.
starter: |
  def letter_grade(score):
      pass
# Shown to the student to type (practice only, D-035). Must pass the tests below.
reference_solution: |
  def letter_grade(score):
      if score >= 90:
          return 'A'
      elif score >= 80:
          return 'B'
      elif score >= 70:
          return 'C'
      elif score >= 60:
          return 'D'
      else:
          return 'F'
tests:
  - {call: "letter_grade(95)", expected: "'A'"}
  - {call: "letter_grade(80)", expected: "'B'"}
  - {call: "letter_grade(59)", expected: "'F'"}
